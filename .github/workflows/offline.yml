name: Offline Luau checks
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned official Luau tools
        run: |
          git clone https://github.com/luau-lang/luau.git /tmp/aa-luau
          git -C /tmp/aa-luau checkout 2a3d8937c19c8fd9f7b72b6ec9068c62760e6588
          make -C /tmp/aa-luau config=release luau luau-compile -j2
      - name: Test logic, observer, transport and bundle
        run: python3 scripts/check.py --luau /tmp/aa-luau/luau --compiler /tmp/aa-luau/luau-compile
